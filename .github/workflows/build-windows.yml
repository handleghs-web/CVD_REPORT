name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tesseract OCR (Korean + English)
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $tess = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$tess\tesseract.exe")) {
            throw "Tesseract executable not found at $tess"
          }
          New-Item -ItemType Directory -Force -Path "$tess\tessdata" | Out-Null
          foreach ($lang in @('kor', 'eng')) {
            $trained = "$tess\tessdata\$lang.traineddata"
            if (!(Test-Path $trained)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $trained
            }
          }
          New-Item -ItemType Directory -Force -Path 'Tesseract-OCR' | Out-Null
          Copy-Item "$tess\*" 'Tesseract-OCR' -Recurse -Force

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name CVD_Report `
            --add-data "Tesseract-OCR;Tesseract-OCR" `
            --collect-all tkinterdnd2 `
            --collect-all pdfplumber `
            --collect-all matplotlib `
            --hidden-import=pytesseract `
            --hidden-import=fitz `
            --hidden-import=PIL `
            cvd_report.py

      - name: Package distributable
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/CVD_Report/*' -DestinationPath 'CVD_Report_Windows_x64_OCR.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CVD_Report_Windows_x64_OCR
          path: CVD_Report_Windows_x64_OCR.zip
          if-no-files-found: error
